<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sidebar</title>
  <meta name="description" content="Bold accent column for contact details and skills, with experience alongside.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; }
    html { background: linear-gradient(to right, var(--accent) 250px, var(--page) 250px); }
    body { display: flex; align-items: flex-start; }
    aside { width: 250px; flex: none; padding: 44px 26px 48px; color: #fff; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .photo { width: 116px; height: 116px; margin: 0 auto 26px; border: 4px solid rgba(255, 255, 255, 0.7); border-radius: 50%; background: rgba(255, 255, 255, 0.2); }
    aside h3, aside .rs-title { margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.35); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.9); }
    aside .rs { margin-top: 0; }
    aside ul { list-style: none; }
    aside li { font-size: 11.5px; line-height: 1.7; word-break: break-word; }
    aside .rs-head, aside .rs-text, aside .rs-skill-label { color: #fff; }
    aside .rs-head { font-size: 12px; }
    aside .rs-date, aside .rs-meta, aside .rs-sub, aside .rs-skill-items { font-size: 11px; color: rgba(255, 255, 255, 0.85); }
    aside .rs-row { display: block; }
    aside .rs-date, aside .rs-meta { display: block; }
    aside .rs-skill { margin-bottom: 8px; }
    aside .rs-skill-label { display: block; font-size: 11.5px; }
    aside .rs-skill-label::after { content: none; }
    aside .rs-entry { margin-bottom: 10px; }
    aside .rs-empty { color: rgba(255, 255, 255, 0.7); }
    main { flex: 1; min-width: 0; padding: 52px 44px 48px 40px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    h1 { font-size: 36px; font-weight: 800; line-height: 1.1; color: #0f172a; }
    .role { margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--accent); }
    main .rs-title { display: flex; align-items: center; gap: 10px; color: #0f172a; }
    main .rs-title::after { content: ""; flex: 1; height: 2px; background: color-mix(in srgb, var(--accent) 30%, var(--page)); }
  </style>
</head>
<body>
  <aside>
    <div class="photo" data-slot="avatar" data-section="personal"></div>
    <div data-group data-section="personal">
      <h3>Contact</h3>
      <ul>
        <li data-slot="email"></li>
        <li data-slot="phone"></li>
        <li data-slot="location"></li>
        <li data-slot="website"></li>
        <li data-slot="linkedin"></li>
      </ul>
    </div>
    <div data-sections="skills education certifications interests"></div>
  </aside>
  <main>
    <header data-section="personal">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="title"></p>
    </header>
    <div data-sections="*"></div>
  </main>
</body>
</html>
