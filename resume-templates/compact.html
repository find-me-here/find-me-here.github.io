<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compact</title>
  <meta name="description" content="Dense single column with small type, for long histories on one page.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; }
    body { padding: 44px 52px 40px; box-decoration-break: clone; -webkit-box-decoration-break: clone; font-size: 11.5px; line-height: 1.42; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
    h1 { font-size: 27px; font-weight: 800; line-height: 1.1; color: #0f172a; }
    .role { margin-top: 3px; font-size: 13px; font-weight: 600; color: var(--accent); }
    .contact { font-size: 11px; line-height: 1.5; color: #64748b; text-align: right; }
    .contact span { display: block; }
    .photo { flex: none; width: 60px; height: 60px; border-radius: 50%; background: #f4f6f8; box-shadow: 0 0 0 2px var(--accent); }
    .who { flex: 1; min-width: 0; }
    .rs { margin-top: 14px; }
    .rs-title { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 11px; letter-spacing: 0.14em; }
    .rs-title::after { content: ""; flex: 1; height: 1px; background: #cbd5e1; }
    .rs-entry { margin-bottom: 9px; }
    .rs-head { font-size: 12.5px; }
    .rs-date, .rs-meta { font-size: 11px; }
    .rs-list { margin-top: 3px; margin-left: 15px; }
    .rs-list li { margin-bottom: 1.5px; }
    .rs-skill { display: grid; grid-template-columns: 118px 1fr; gap: 12px; margin-bottom: 3px; }
    .rs-skill-label::after { content: none; }
  </style>
</head>
<body>
  <header data-section="personal">
    <div class="who">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="title"></p>
    </div>
    <p class="contact" data-group><span data-slot="location"></span><span data-slot="email"></span><span data-slot="phone"></span><span data-slot="website"></span><span data-slot="linkedin"></span></p>
    <div class="photo" data-slot="avatar"></div>
  </header>
  <main data-sections="*"></main>
</body>
</html>
