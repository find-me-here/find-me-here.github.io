<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Banner</title>
  <meta name="description" content="Full-width colour header over a main column and a narrow side column.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; }
    header { display: flex; align-items: center; gap: 24px; padding: 38px 56px; background: var(--accent); color: #fff; }
    .who { flex: 1; min-width: 0; }
    h1 { font-size: 38px; font-weight: 800; line-height: 1.1; }
    .role { margin-top: 4px; font-size: 16px; opacity: 0.92; }
    .contact { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 16px; font-size: 11.5px; opacity: 0.92; }
    .photo { flex: none; width: 88px; height: 88px; border: 3px solid rgba(255, 255, 255, 0.75); border-radius: 50%; background: rgba(255, 255, 255, 0.2); }
    .cols { display: flex; align-items: flex-start; gap: 30px; padding: 12px 56px 48px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .cols > div:first-child { flex: 1; min-width: 0; }
    .side { flex: none; width: 216px; padding-left: 26px; border-left: 2px solid color-mix(in srgb, var(--accent) 22%, var(--page)); }
    .cols .rs-title { font-size: 12.5px; }
    .side .rs-entry { margin-bottom: 10px; }
    .side .rs-row { display: block; }
    .side .rs-date, .side .rs-meta { display: block; }
    .side .rs-head { font-size: 12px; }
    .side .rs-skill { margin-bottom: 8px; }
    .side .rs-skill-label { display: block; }
    .side .rs-skill-label::after { content: none; }
    .side .rs-skill-items { display: block; }
    .side .rs-chip { display: inline-block; margin: 0 4px 6px 0; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, var(--page)); font-size: 11px; color: #0f172a; }
    .side .rs-chip::after { content: none; }
  </style>
</head>
<body>
  <header data-section="personal">
    <div class="who">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="title"></p>
      <p class="contact" data-group><span data-slot="location"></span><span data-slot="email"></span><span data-slot="phone"></span><span data-slot="website"></span><span data-slot="linkedin"></span></p>
    </div>
    <div class="photo" data-slot="avatar"></div>
  </header>
  <div class="cols">
    <div data-sections="*"></div>
    <div class="side" data-sections="skills education certifications interests"></div>
  </div>
</body>
</html>
