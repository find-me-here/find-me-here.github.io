<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Modern</title>
  <meta name="description" content="Accent header bar with a clean, contemporary layout.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; }
    .bar { height: 12px; background: var(--accent); }
    .page { padding: 36px 64px 48px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    header { display: flex; align-items: flex-start; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--accent); }
    .who { flex: 1; min-width: 0; }
    h1 { font-size: 32px; font-weight: 700; line-height: 1.2; color: #0f172a; }
    .role { margin-top: 4px; font-size: 15px; color: var(--accent); }
    .contact { display: flex; flex-wrap: wrap; gap: 4px 0; margin-top: 12px; font-size: 12px; color: #64748b; }
    .contact span + span::before { content: "·"; margin: 0 8px; color: #cbd5e1; }
    .photo { flex: none; width: 80px; height: 80px; border-radius: 50%; background: #f4f6f8; box-shadow: 0 0 0 2px var(--accent); }
    .rs:first-child { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="page">
    <header data-section="personal">
      <div class="who">
        <h1 data-slot="name"></h1>
        <p class="role" data-slot="title"></p>
        <p class="contact" data-group><span data-slot="location"></span><span data-slot="email"></span><span data-slot="phone"></span><span data-slot="website"></span><span data-slot="linkedin"></span></p>
      </div>
      <div class="photo" data-slot="avatar"></div>
    </header>
    <main data-sections="*"></main>
  </div>
</body>
</html>
