<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Editorial</title>
  <meta name="description" content="Magazine masthead, serif headlines and a drop-cap summary.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; --serif: Georgia, "Times New Roman", serif; }
    body { padding: 48px 62px 48px; box-decoration-break: clone; -webkit-box-decoration-break: clone; color: #27272a; }
    header { display: flex; align-items: center; gap: 24px; padding: 16px 0 14px; border-top: 4px solid #18181b; border-bottom: 1px solid #18181b; }
    .who { flex: 1; min-width: 0; }
    h1 { font: 400 50px/1.02 var(--serif); letter-spacing: -0.015em; overflow-wrap: anywhere; color: #18181b; }
    .role { margin-top: 10px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
    .photo { flex: none; width: 84px; height: 84px; border-radius: 50%; background: #f4f4f5; box-shadow: 0 0 0 1px #18181b; }
    .contact { display: flex; flex-wrap: wrap; gap: 3px 0; margin-top: 9px; font-size: 11px; letter-spacing: 0.02em; color: #52525b; }
    .contact span + span::before { content: "/"; margin: 0 10px; color: var(--accent); }

    .rs { margin-top: 24px; }
    .rs-title { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; font: italic 400 20px/1.2 var(--serif); letter-spacing: 0; text-transform: none; color: #18181b; }
    .rs-title::after { content: ""; flex: 1; height: 1px; background: #d4d4d8; }
    .rs-summary { display: flow-root; }
    .rs-summary .rs-text { font: 15.5px/1.55 var(--serif); color: #18181b; }
    .rs-summary .rs-text::first-letter { float: left; margin: 5px 9px 0 0; font-size: 52px; line-height: 0.8; color: var(--accent); }
    .rs-entry { margin-bottom: 15px; }
    .rs-head { font: 700 15px/1.35 var(--serif); color: #18181b; }
    .rs-date, .rs-meta { font: italic 12.5px var(--serif); color: #52525b; }
    .rs-sub { font-size: 10.5px; font-weight: 700; font-style: normal; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    .rs-list li::marker { color: var(--accent); }
    .rs-stack { font-style: normal; }

    /* Skills read as two columns of short lists. */
    .rs-skills { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 32px; }
    .rs-skills .rs-title { grid-column: 1 / -1; margin-bottom: 0; }
    .rs-skill { margin-bottom: 0; }
    .rs-skill-label { display: block; font: italic 700 13.5px var(--serif); }
    .rs-skill-label::after { content: none; }
  </style>
</head>
<body>
  <header data-section="personal">
    <div class="who">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="title"></p>
    </div>
    <div class="photo" data-slot="avatar"></div>
  </header>
  <p class="contact" data-group data-section="personal"><span data-slot="location"></span><span data-slot="email"></span><span data-slot="phone"></span><span data-slot="website"></span><span data-slot="linkedin"></span></p>
  <main data-sections="*"></main>
</body>
</html>
