<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fresh</title>
  <meta name="description" content="Soft gradient header card, rounded photo and pill-shaped headings.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; --ink: color-mix(in srgb, var(--accent) 75%, #0f172a); }
    body { padding: 36px 40px 44px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    header { display: flex; align-items: center; gap: 24px; padding: 28px 30px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--page)), color-mix(in srgb, var(--accent) 5%, var(--page))); }
    .photo { flex: none; width: 104px; height: 104px; border-radius: 26px; background: color-mix(in srgb, var(--accent) 28%, var(--page)); box-shadow: 0 0 0 4px var(--page); }
    .who { flex: 1; min-width: 0; }
    h1 { font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; overflow-wrap: anywhere; color: #0f172a; }
    .role { margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--ink); }
    .contact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .contact span { max-width: 100%; padding: 4px 11px; border-radius: 999px; background: var(--page); font-size: 11px; color: #334155; word-break: break-word; }

    main { padding: 0 8px; }
    .rs { margin-top: 22px; }
    .rs-title { display: table; margin-bottom: 12px; padding: 5px 13px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, var(--page)); font-size: 11px; letter-spacing: 0.12em; color: var(--ink); }
    .rs-head { font-size: 13.5px; }
    .rs-date { padding: 1px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 9%, var(--page)); font-size: 11px; font-weight: 600; color: var(--ink); }
    .rs-sub { margin-top: 2px; font-style: normal; font-weight: 500; color: #475569; }
    .rs-list li::marker { color: var(--accent); }
    .rs-skill { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    .rs-skill-label { flex: none; width: 110px; }
    .rs-skill-label::after { content: none; }
    .rs-chip { display: inline-block; margin: 0 4px 5px 0; padding: 1px 10px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--page)); border-radius: 999px; font-size: 11.5px; color: #1e293b; }
    .rs-chip::after { content: none; }
  </style>
</head>
<body>
  <header data-section="personal">
    <div class="photo" data-slot="avatar"></div>
    <div class="who">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="title"></p>
      <p class="contact" data-group><span data-slot="email"></span><span data-slot="phone"></span><span data-slot="location"></span><span data-slot="website"></span><span data-slot="linkedin"></span></p>
    </div>
  </header>
  <main data-sections="*"></main>
</body>
</html>
