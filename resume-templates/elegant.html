<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Elegant</title>
  <meta name="description" content="Refined serif layout with a centered header, an ornament and quiet section rules.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; }
    body { padding: 60px 72px 48px; box-decoration-break: clone; -webkit-box-decoration-break: clone; color: #334155; font-family: Georgia, "Times New Roman", serif; line-height: 1.55; }
    header { text-align: center; }
    .photo { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 50%; background: #f4f6f8; box-shadow: 0 0 0 2px var(--page), 0 0 0 3px var(--accent); }
    h1 { font-size: 34px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: #0f172a; }
    .role { margin-top: 8px; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }
    .orn { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0 12px; }
    .orn::before, .orn::after { content: ""; width: 120px; height: 1px; background: var(--accent); }
    .orn i { width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); }
    .contact { display: flex; flex-wrap: wrap; justify-content: center; font-size: 11.5px; color: #64748b; }
    .contact span + span::before { content: "·"; margin: 0 10px; }
    .rs { margin-top: 26px; }
    .rs-title { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; font-size: 11.5px; font-weight: 400; letter-spacing: 0.26em; }
    .rs-title::before, .rs-title::after { content: ""; flex: 1; height: 1px; background: #d8dee6; }
    .rs-summary .rs-text { text-align: center; }
    .rs-date, .rs-meta { font-style: italic; }
    .rs-sub { color: var(--accent); }
  </style>
</head>
<body>
  <header data-section="personal">
    <div class="photo" data-slot="avatar"></div>
    <h1 data-slot="name"></h1>
    <p class="role" data-slot="title"></p>
    <div class="orn"><i></i></div>
    <p class="contact" data-group><span data-slot="location"></span><span data-slot="email"></span><span data-slot="phone"></span><span data-slot="website"></span><span data-slot="linkedin"></span></p>
  </header>
  <main data-sections="*"></main>
</body>
</html>
