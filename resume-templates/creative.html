<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Creative</title>
  <meta name="description" content="Soft tinted side rail, round photo and skill pills for design-led roles.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; }
    html { background: linear-gradient(to right, color-mix(in srgb, var(--accent) 9%, var(--page)) 236px, var(--page) 236px); }
    body { position: relative; display: flex; align-items: flex-start; overflow: hidden; }
    aside { width: 236px; flex: none; padding: 50px 26px 48px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .photo { width: 140px; height: 140px; margin: 0 auto 28px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 25%, var(--page)); box-shadow: 0 0 0 5px var(--page), 0 0 0 9px var(--accent); }
    aside h3, aside .rs-title { margin: 22px 0 8px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    aside ul { list-style: none; }
    aside li { font-size: 11.5px; line-height: 1.7; word-break: break-word; }
    aside .rs { margin-top: 0; }
    aside .rs-row { display: block; }
    aside .rs-date, aside .rs-meta { display: block; }
    aside .rs-head { font-size: 12px; }
    aside .rs-entry { margin-bottom: 10px; }
    aside .rs-skill-label { display: block; margin-bottom: 4px; font-size: 11px; color: #64748b; }
    aside .rs-skill-label::after { content: none; }
    aside .rs-chip { display: inline-block; margin: 0 4px 6px 0; padding: 4px 10px; border-radius: 999px; background: var(--accent); font-size: 11px; color: #fff; }
    aside .rs-chip::after { content: none; }
    main { position: relative; flex: 1; min-width: 0; padding: 54px 44px 48px 40px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    main::before { content: ""; position: absolute; top: -90px; right: -70px; width: 240px; height: 240px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 14%, var(--page)); }
    main > * { position: relative; }
    h1 { font-size: 40px; font-weight: 800; line-height: 1.05; color: #0f172a; }
    .role { margin-top: 8px; font-size: 16px; font-weight: 600; color: var(--accent); }
    main .rs-title { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; font-size: 15px; letter-spacing: 0; text-transform: none; color: #0f172a; }
    main .rs-title::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    main .rs-entry { margin-bottom: 10px; padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 6%, var(--page)); }
    .rs-date { font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
  <aside>
    <div class="photo" data-slot="avatar" data-section="personal"></div>
    <div data-group data-section="personal">
      <h3>Contact</h3>
      <ul>
        <li data-slot="email"></li>
        <li data-slot="phone"></li>
        <li data-slot="location"></li>
        <li data-slot="website"></li>
        <li data-slot="linkedin"></li>
      </ul>
    </div>
    <div data-sections="skills education certifications interests"></div>
  </aside>
  <main>
    <header data-section="personal">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="title"></p>
    </header>
    <div data-sections="*"></div>
  </main>
</body>
</html>
