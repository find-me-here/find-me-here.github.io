<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Academic</title>
  <meta name="description" content="Traditional CV for research and teaching, with room for publications.">
  <style>
    :root { --accent: #0f766e; --page: #ffffff; }
    body { padding: 52px 62px 48px; box-decoration-break: clone; -webkit-box-decoration-break: clone; color: #111827; font: 12px/1.45 "Times New Roman", Times, Georgia, serif; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--accent); }
    .who { flex: 1; min-width: 0; }
    h1 { font-size: 27px; font-weight: 700; line-height: 1.1; }
    .role { margin-top: 3px; font-size: 13px; font-style: italic; color: #374151; }
    .contact { font-size: 11.5px; line-height: 1.5; color: #374151; text-align: right; }
    .contact span { display: block; }
    .photo { flex: none; width: 64px; height: 64px; border-radius: 4px; background: #f3f4f6; box-shadow: 0 0 0 1px var(--accent); }
    .rs { margin-top: 17px; }
    .rs-title { margin-bottom: 8px; padding-bottom: 2px; border-bottom: 1px solid var(--accent); font-size: 13px; font-variant: small-caps; font-weight: 700; letter-spacing: 0.06em; text-transform: none; }
    .rs-head { font-size: 12px; }
    .rs-date, .rs-meta { font-size: 11.5px; color: #4b5563; }
    .rs-entry { margin-bottom: 9px; }
    .rs-list { margin-top: 2px; margin-left: 18px; }
    .rs-list li { margin-bottom: 2px; }
    .rs-sub { color: #374151; }
  </style>
</head>
<body>
  <header data-section="personal">
    <div class="who">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="title"></p>
    </div>
    <p class="contact" data-group><span data-slot="location"></span><span data-slot="email"></span><span data-slot="phone"></span><span data-slot="website"></span><span data-slot="linkedin"></span></p>
    <div class="photo" data-slot="avatar"></div>
  </header>
  <main data-sections="*"></main>
</body>
</html>
